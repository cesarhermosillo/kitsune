<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Kitsune works</title>
  <desc>ClickUp inbox to Kitsune triage, proposal to Telegram or the desktop pet, approval with a workflow, crear_sesion in Ronin over MCP, and a watcher that forwards session questions back to Telegram.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b4fd6"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #b9b0dc; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1f1b2e; }
      .sub { font-size: 12.5px; fill: #4a4560; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #6b4fd6; }
      .edge { stroke: #6b4fd6; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font-size: 12px; fill: #3b3552; font-weight: 600; }
      .step { fill: #f08a3c; }
      .stepn { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- solid background so it reads the same on light and dark themes -->
  <rect width="1000" height="470" rx="16" fill="#f7f5fd"/>

  <!-- Kitsune daemon region -->
  <rect x="282" y="34" width="266" height="408" rx="14" fill="#fff4ea" stroke="#f08a3c" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="415" y="58" text-anchor="middle" class="title" fill="#b85a14" style="fill:#b85a14">Kitsune daemon</text>

  <!-- 1 ClickUp -->
  <rect class="box" x="30" y="80" width="170" height="90" rx="10"/>
  <text x="115" y="115" text-anchor="middle" class="title">ClickUp inbox</text>
  <text x="115" y="137" text-anchor="middle" class="sub">assigned tasks,</text>
  <text x="115" y="153" text-anchor="middle" class="sub">mentions, comments</text>

  <!-- 2 Triage -->
  <rect class="box" x="300" y="80" width="230" height="100" rx="10"/>
  <text x="415" y="108" text-anchor="middle" class="title">Triage (brain)</text>
  <text x="415" y="129" text-anchor="middle" class="mono">claude · codex · agy</text>
  <text x="415" y="147" text-anchor="middle" class="sub">headless, schema-validated</text>
  <text x="415" y="164" text-anchor="middle" class="sub">→ proposal (SQLite + audit)</text>

  <!-- 4 Launch -->
  <rect class="box" x="300" y="215" width="230" height="75" rx="10"/>
  <text x="415" y="243" text-anchor="middle" class="title">Launch</text>
  <text x="415" y="265" text-anchor="middle" class="sub">repo + chosen workflow</text>
  <text x="415" y="281" text-anchor="middle" class="mono">crear_sesion</text>

  <!-- 6 Watcher -->
  <rect class="box" x="300" y="325" width="230" height="95" rx="10"/>
  <text x="415" y="353" text-anchor="middle" class="title">Watcher</text>
  <text x="415" y="374" text-anchor="middle" class="mono">estado_sesiones</text>
  <text x="415" y="391" text-anchor="middle" class="mono">responder_sesion</text>
  <text x="415" y="408" text-anchor="middle" class="sub">questions, done, stuck</text>

  <!-- 5 Ronin -->
  <rect class="box" x="30" y="275" width="170" height="110" rx="10"/>
  <text x="115" y="310" text-anchor="middle" class="title">Ronin</text>
  <text x="115" y="332" text-anchor="middle" class="sub">MCP server</text>
  <text x="115" y="350" text-anchor="middle" class="sub">tmux Claude workers</text>
  <text x="115" y="368" text-anchor="middle" class="sub">run the workflow</text>

  <!-- 3 You: Telegram + pet -->
  <rect x="626" y="56" width="352" height="238" rx="14" fill="#ece7fb" stroke="#b9b0dc" stroke-width="1.5"/>
  <rect class="box" x="640" y="70" width="330" height="95" rx="10"/>
  <text x="805" y="100" text-anchor="middle" class="title">Telegram bot</text>
  <text x="805" y="122" text-anchor="middle" class="sub">proposal with buttons</text>
  <text x="805" y="142" text-anchor="middle" class="sub">✅ → pick a workflow · ✏️ edit · ❌ ignore</text>

  <rect class="box" x="640" y="185" width="330" height="95" rx="10"/>
  <text x="805" y="215" text-anchor="middle" class="title">Desktop pet</text>
  <text x="805" y="237" text-anchor="middle" class="sub">same proposals in a bubble (local API)</text>
  <text x="805" y="257" text-anchor="middle" class="sub">🚀 Lanzar… · ❌ Ignorar · 🔁 Reintentar</text>

  <rect class="box" x="640" y="325" width="330" height="95" rx="10"/>
  <text x="805" y="355" text-anchor="middle" class="title">Telegram (sessions)</text>
  <text x="805" y="377" text-anchor="middle" class="sub">a session asks something → you reply</text>
  <text x="805" y="397" text-anchor="middle" class="sub">plus finished / stuck notices</text>

  <!-- edges -->
  <path class="edge" d="M200,125 L298,125"/>
  <text x="249" y="116" text-anchor="middle" class="label">poll</text>

  <path class="edge" d="M530,125 L624,125"/>
  <text x="577" y="116" text-anchor="middle" class="label">proposal</text>

  <path class="edge" d="M626,252 L532,252"/>
  <text x="579" y="228" text-anchor="middle" class="label">approve</text>
  <text x="579" y="243" text-anchor="middle" class="label">+ workflow</text>

  <path class="edge" d="M300,252 C250,252 240,300 202,305"/>
  <text x="236" y="248" text-anchor="middle" class="label">MCP</text>

  <path class="edge" d="M200,355 L298,355"/>
  <text x="249" y="346" text-anchor="middle" class="label">status</text>
  <path class="edge" d="M298,395 L202,395"/>
  <text x="249" y="412" text-anchor="middle" class="label">reply</text>

  <path class="edge" d="M530,355 L638,355"/>
  <text x="584" y="346" text-anchor="middle" class="label">question</text>
  <path class="edge" d="M638,395 L532,395"/>
  <text x="584" y="412" text-anchor="middle" class="label">your reply</text>

  <!-- step numbers -->
  <circle class="step" cx="40" cy="80" r="12"/><text class="stepn" x="40" y="84">1</text>
  <circle class="step" cx="310" cy="80" r="12"/><text class="stepn" x="310" y="84">2</text>
  <circle class="step" cx="650" cy="70" r="12"/><text class="stepn" x="650" y="74">3</text>
  <circle class="step" cx="310" cy="215" r="12"/><text class="stepn" x="310" y="219">4</text>
  <circle class="step" cx="40" cy="275" r="12"/><text class="stepn" x="40" y="279">5</text>
  <circle class="step" cx="310" cy="325" r="12"/><text class="stepn" x="310" y="329">6</text>
</svg>
